<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Deore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      position: relative;
    }

    /* Torch: bright white light fixed directly behind the cube,
       everything else stays pure black like space */
    /* Bright white core, placed behind the upper part of the cube */
    #torch {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 420px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        #fff                      0%,
        #fff                      38%,
        rgba(255, 255, 255, 0.7)  55%,
        rgba(255, 255, 255, 0)    72%
      );
      filter: blur(14px);
      z-index: 0;
    }

    /* Soft halo around the core so the light spreads out naturally */
    #torch::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 900px;
      height: 900px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.09) 25%,
        rgba(255, 255, 255, 0.04) 45%,
        rgba(255, 255, 255, 0.01) 60%,
        rgba(255, 255, 255, 0)    70%
      );
    }

    #box {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      z-index: 1;
      touch-action: none;
      user-select: none;
      will-change: transform;
    }

    #box:active {
      cursor: grabbing;
    }

    /* All 6 faces — colors are set by JS from the light direction */
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 1px solid rgba(255,255,255,0.4);
      background: #0a0a0a;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    }

    .front  { transform: translateZ(100px); }
    .back   { transform: rotateY(180deg) translateZ(100px); }
    .right  { transform: rotateY(90deg) translateZ(100px); }
    .left   { transform: rotateY(-90deg) translateZ(100px); }
    .top    { transform: rotateX(90deg) translateZ(100px); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); }
  </style>
</head>
<body>

  <div id="torch"></div>

  <div id="box">
    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>

  <script>
    const box = document.getElementById('box');

    // ── Lighting ─────────────────────────────────────────────────
    // Face normals in the cube's local space (CSS: +x right, +y down, +z toward viewer)
    const faces = [
      { el: box.querySelector('.front'),  n: [ 0,  0,  1] },
      { el: box.querySelector('.back'),   n: [ 0,  0, -1] },
      { el: box.querySelector('.right'),  n: [ 1,  0,  0] },
      { el: box.querySelector('.left'),   n: [-1,  0,  0] },
      { el: box.querySelector('.top'),    n: [ 0, -1,  0] },
      { el: box.querySelector('.bottom'), n: [ 0,  1,  0] },
    ];

    // Torch sits directly behind the centre of the cube (tilted up slightly
    // so the top face still catches a little light)
    const L = normalize([0, -0.35, -0.94]);
    const V = [0, 0, 1];                      // viewer direction
    const H = normalize([L[0] + V[0], L[1] + V[1], L[2] + V[2]]); // for highlights

    function normalize(v) {
      const len = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / len, v[1] / len, v[2] / len];
    }
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

    // Same order as CSS "rotateX(..) rotateY(..)": rotateY applies first, then rotateX
    function rotateNormal([x, y, z], ax, ay) {
      const cy = Math.cos(ay), sy = Math.sin(ay);
      const x1 =  x * cy + z * sy;
      const z1 = -x * sy + z * cy;
      const cx = Math.cos(ax), sx = Math.sin(ax);
      return [x1, y * cx - z1 * sx, y * sx + z1 * cx];
    }

    function updateLighting() {
      const ax = rotX * Math.PI / 180;
      const ay = rotY * Math.PI / 180;

      faces.forEach(f => {
        const n = rotateNormal(f.n, ax, ay);

        const diffuse  = Math.max(0, dot(n, L));             // direct torch light
        const rim      = Math.pow(1 - Math.abs(n[2]), 3);    // light wrapping round the edges
        const specular = Math.pow(Math.max(0, dot(n, H)), 24);

        // light amount 0..1 (small ambient so dark faces are not fully black)
        const light = Math.min(1, 0.04 + diffuse * 0.75 + rim * 0.35 + specular * 0.5);

        const hi = Math.round(10 + light * 200);  // lit side of the face
        const lo = Math.round(6  + light * 120);  // shadow side of the face

        // gradient runs toward the torch so each face is brighter on the side nearer the light
        const angle = Math.atan2(-n[1], -n[0]) * 180 / Math.PI + 90;
        f.el.style.background =
          `linear-gradient(${angle}deg, rgb(${hi},${hi},${hi + 4}) 0%, rgb(${lo},${lo},${lo + 3}) 100%)`;
        f.el.style.borderColor = `rgba(255,255,255,${(0.15 + light * 0.75).toFixed(2)})`;
      });
    }

    let activePointerId = null;
    let startX = 0, startY = 0;
    let rotX = -20, rotY = 30;

    function updateScene() {
      // The glow stays fixed behind the centred cube.
      box.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      updateLighting();
    }

    function moveCube(clientX, clientY) {
      const deltaX = clientX - startX;
      const deltaY = clientY - startY;

      // Horizontal movement turns the cube left/right; vertical movement tilts it.
      rotY += deltaX * 0.5;
      rotX -= deltaY * 0.5;

      startX = clientX;
      startY = clientY;
      updateScene();
    }

    // Pointer events cover mouse, touch, and pen, and pointer capture keeps
    // the drag reliable even if the pointer leaves the cube.
    box.addEventListener('pointerdown', e => {
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      box.setPointerCapture(e.pointerId);
    });

    box.addEventListener('pointermove', e => {
      if (e.pointerId !== activePointerId) return;
      moveCube(e.clientX, e.clientY);
    });

    function stopDragging(e) {
      if (e.pointerId !== activePointerId) return;
      activePointerId = null;
      if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId);
    }

    box.addEventListener('pointerup', stopDragging);
    box.addEventListener('pointercancel', stopDragging);

    // Initial position and rotation.
    updateScene();
  </script>
</body>
</html>
