<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Deore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      position: relative;
    }

    /* Torch spotlight effect */
    #torch {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 400px at 50% 40%,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(200, 200, 200, 0.1) 30%,
        rgba(100, 100, 100, 0.04) 50%,
        transparent 70%
      );
      z-index: 0;
    }

    #box {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      z-index: 1;
    }

    #box:active {
      cursor: grabbing;
    }

    /* All 6 faces */
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* Front - brightest */
    .front  { 
      transform: translateZ(100px);
      background: linear-gradient(135deg, #505050 0%, #3c3c3c 100%);
      box-shadow: 
        inset -20px -20px 40px rgba(0,0,0,0.3),
        inset 10px 10px 20px rgba(255,255,255,0.08);
    }
    
    /* Back - darkest */
    .back   { 
      transform: rotateY(180deg) translateZ(100px);
      background: linear-gradient(135deg, #0f0f0f 0%, #0a0a0a 100%);
      border-color: rgba(255,255,255,0.2);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
    }
    
    /* Right - medium */
    .right  { 
      transform: rotateY(90deg) translateZ(100px);
      background: linear-gradient(to left, #323232 0%, #232323 100%);
      box-shadow: 
        inset 15px 0 30px rgba(0,0,0,0.4),
        inset -8px -8px 20px rgba(255,255,255,0.04);
    }
    
    /* Left - medium */
    .left   { 
      transform: rotateY(-90deg) translateZ(100px);
      background: linear-gradient(to right, #323232 0%, #232323 100%);
      box-shadow: 
        inset -15px 0 30px rgba(0,0,0,0.4),
        inset 8px -8px 20px rgba(255,255,255,0.04);
    }
    
    /* Top - bright */
    .top    { 
      transform: rotateX(90deg) translateZ(100px);
      background: linear-gradient(180deg, #5a5a5a 0%, #414141 100%);
      border-color: rgba(255,255,255,0.45);
      box-shadow: 
        inset 0 15px 35px rgba(0,0,0,0.3),
        inset 0 -8px 20px rgba(255,255,255,0.06);
    }
    
    /* Bottom - darker */
    .bottom { 
      transform: rotateX(-90deg) translateZ(100px);
      background: linear-gradient(180deg, #191919 0%, #121212 100%);
      border-color: rgba(255,255,255,0.25);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div id="torch"></div>

  <div id="box">
    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>

  <script>
    const box = document.getElementById('box');

    let isDragging = false;
    let startX = 0, startY = 0;
    let rotX = -20, rotY = 30;

    // Mouse down - start drag
    box.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    // Mouse move - rotate while dragging
    document.addEventListener('mousemove', e => {
      if (!isDragging) return;

      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      rotY = rotY + deltaX * 0.5;
      rotX = rotX - deltaY * 0.5;

      box.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

      startX = e.clientX;
      startY = e.clientY;
    });

    // Mouse up - stop drag
    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Touch support
    box.addEventListener('touchstart', e => {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      e.preventDefault();
    });

    document.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      rotY = rotY + deltaX * 0.5;
      rotX = rotX - deltaY * 0.5;
      box.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      e.preventDefault();
    });

    document.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Initial rotation
    box.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  </script>
</body>
</html>
